version: '3.8'

services:
  satquery-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: satquery_ai_server
    ports:
      - "8080:8080"
    volumes:
      - ./checkpoints:/app/checkpoints:ro
      - ./custom_input:/app/custom_input
      - ./custom_output:/app/custom_output
    environment:
      - PORT=8080
      - CUDA_VISIBLE_DEVICES=0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
